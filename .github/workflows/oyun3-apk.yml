name: Nabız Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oyun3-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report build started
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context=oyun3/apk
          -f description='Building and checking Nabız 1.1.0'
          -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check source and SDK compatibility
        run: |
          npx expo install --check
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease
          -PreactNativeArchitectures=arm64-v8a,x86_64
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -Dkotlin.daemon.jvm.options=-Xmx1024m
          --max-workers=2 --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          mkdir -p dist diagnostics
          cp android/app/build/outputs/apk/release/app-release.apk dist/nabiz.apk
          python3 tools/verify_apk.py dist/nabiz.apk
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner_path" verify --verbose dist/nabiz.apk
          (cd dist && sha256sum nabiz.apk > nabiz.apk.sha256)


      - name: Keep APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabiz-apk
          path: |
            dist/nabiz.apk
            dist/nabiz.apk.sha256
          if-no-files-found: ignore
          retention-days: 30


      - name: Report build failure
        if: failure()
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=failure -f context=oyun3/apk
          -f description='Android build failed'
          -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  test_and_publish:
    name: Test APK on fresh runner and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report test started
        run: >-
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context=oyun3/apk
          -f description='Testing standalone APK on fresh runner'
          -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: nabiz-apk
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}

      - name: Download previous version for upgrade test
        uses: actions/download-artifact@v4
        with:
          name: oyun3-apk
          path: previous
          github-token: ${{ github.token }}
          run-id: 38625640681

      - name: Check APK contents and checksum
        run: |
          (cd dist && sha256sum -c nabiz.apk.sha256)
          python3 tools/verify_apk.py dist/nabiz.apk
          df -h .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test upgrade, four modes, sustained play and resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/smoke_android.py dist/nabiz.apk previous/oyun3.apk

      - name: Publish APK download
        run: |
          tag="v1.1.0-build.$GITHUB_RUN_NUMBER"
          gh release create "$tag" dist/nabiz.apk dist/nabiz.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Nabız 1.1 — Yeni ritim' --notes-file RELEASE_NOTES.md
          printf '## nabiz.apk\n\nOffline startup, upgrade, four modes, two-minute play and resume tests passed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabiz-test-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report final result
        if: always()
        env:
          TEST_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$TEST_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f context=oyun3/apk \
            -f "description=APK test: $TEST_RESULT" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
