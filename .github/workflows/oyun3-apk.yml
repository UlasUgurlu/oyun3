name: oyun3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oyun3-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  android:
    name: Build and test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report build started
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=pending -f context=oyun3/apk
          -f description='Building and checking oyun3.apk'
          -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check source and SDK compatibility
        run: |
          npx expo install --check
          npm run typecheck
          npm run lint
          npm test -- --runInBand

      - name: Generate Android project from Expo config
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: >-
          ./gradlew :app:assembleRelease
          -PreactNativeArchitectures=arm64-v8a,x86_64
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -Dkotlin.daemon.jvm.options=-Xmx1024m
          --max-workers=2 --no-daemon --stacktrace

      - name: Verify and name APK
        run: |
          mkdir -p dist diagnostics
          cp android/app/build/outputs/apk/release/app-release.apk dist/oyun3.apk
          python3 tools/verify_apk.py dist/oyun3.apk
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner_path" verify --verbose dist/oyun3.apk
          (cd dist && sha256sum oyun3.apk > oyun3.apk.sha256)

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test offline startup, gameplay and resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/smoke_android.py dist/oyun3.apk

      - name: Keep APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oyun3-apk
          path: |
            dist/oyun3.apk
            dist/oyun3.apk.sha256
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish APK download
        run: |
          tag="v1.0.0-build.$GITHUB_RUN_NUMBER"
          gh release create "$tag" dist/oyun3.apk dist/oyun3.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Nabız — oyun3 APK' --notes-file RELEASE_NOTES.md
          printf '## oyun3.apk\n\nAndroid release APK built with embedded game code, fonts and sounds.\n\nOffline emulator smoke test passed.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oyun3-test-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report final build result
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$BUILD_RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f "state=$state" -f context=oyun3/apk \
            -f "description=APK build: $BUILD_RESULT" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
